# usb_cam driver parameters for camera_left.
#
# Hardware: ELP-USBFHD01M-SFV(2.8-12), UVC, USB 2.0, vendor 32e4:3291.
#
# The device only advertises a discrete 60 fps interval for every MJPEG
# resolution - there is no 30 fps mode - so `framerate` must be 60.0 or the
# driver has nothing to negotiate. Measured delivery is ~45 fps at 1080p;
# the 60 in the descriptor is what the interface allows, not what the sensor
# sustains. That is well above what the perception stack consumes.
#
# YUYV is deliberately not used: this device caps at 5 fps for 1080p YUYV.
/**:
  ros__parameters:
    video_device: "/dev/buggy_cam0"
    frame_id: "camera_left/camera_optical_link"
    camera_name: "camera_left"

    # camera_info_manager resolves package:// URLs, which keeps this portable
    # across machines. The previous absolute path pointed at a workspace that
    # only ever existed on a different host.
    camera_info_url: "package://buggy_sensor_kit_launch/config/camera_configuration/camera_left_info.yaml"

    # image_transport advertises every installed plugin by default. For an rgb8
    # camera that means a compressedDepth topic that can never publish (it only
    # handles 16UC1/32FC1 depth encodings) and a theora topic that burns CPU
    # encoding video nobody subscribes to - measured at 6 Hz against a 48 Hz
    # source, i.e. dropping ~80% of frames while still costing the encode.
    #
    # This is an ALLOWLIST, not a denylist: only the plugins named here are
    # advertised. "raw" is itself a plugin and MUST be listed - omitting it
    # silently stops image_raw being published at all, which breaks every
    # perception node and the calibrator with no error message.
    image_raw:
      enable_pub_plugins:
        - "image_transport/raw"
        - "image_transport/compressed"

      # NOTE: jpeg_quality is NOT set here. The compressed-transport plugin
      # declares it as ".image_raw.jpeg_quality" (leading dot), which a params
      # file cannot express. It is set in cameras.launch.xml instead.

    image_width: 1920
    image_height: 1080
    framerate: 60.0
    io_method: "mmap"
    pixel_format: "mjpeg2rgb"
    av_device_format: "YUV422P"

    # 50 Hz matches the local mains frequency; getting this wrong produces
    # rolling brightness bands under fluorescent lighting.
    power_line_frequency: 1

    brightness: 0
    contrast: 3
    saturation: 62
    hue: 0
    gamma: 120
    sharpness: 2
    auto_white_balance: true
    white_balance: 4600

    # Aperture Priority. Auto exposure keeps the image usable across varying
    # light but lets the frame interval drift with exposure time. Switch to
    # manual (auto_exposure: 1) with a fixed exposure once the operating
    # lighting is known - a constant frame interval matters for lidar/camera
    # time alignment.
    auto_exposure: 3
